name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-security:
    name: Build, Integration Tests, Security Scan
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Verify OpenSSH client tools
        shell: pwsh
        run: |
          Get-Command "$env:WINDIR\System32\OpenSSH\sftp.exe"
          Get-Command "$env:WINDIR\System32\OpenSSH\scp.exe"
          Get-Command "$env:WINDIR\System32\OpenSSH\ssh-keygen.exe"

      - name: Restore
        shell: pwsh
        run: |
          $projects = @(
            "ApacheMinaSSHD.NET.Bindings/ApacheMinaSSHD.NET.Bindings.csproj",
            "ApacheMinaSSHD.NET.Wrapper/ApacheMinaSSHD.NET.Wrapper.csproj",
            "SimpleSSHDSever/SimpleSSHDSever.csproj"
          )

          foreach ($project in $projects) {
            dotnet restore $project
          }

      - name: Build
        shell: pwsh
        run: |
          $projects = @(
            "ApacheMinaSSHD.NET.Bindings/ApacheMinaSSHD.NET.Bindings.csproj",
            "ApacheMinaSSHD.NET.Wrapper/ApacheMinaSSHD.NET.Wrapper.csproj",
            "SimpleSSHDSever/SimpleSSHDSever.csproj"
          )

          foreach ($project in $projects) {
            dotnet build $project --no-restore
          }

      - name: Public API guard
        shell: pwsh
        run: ./eng/verify-public-api.ps1

      - name: XML documentation guard
        shell: pwsh
        run: ./eng/verify-xml-docs.ps1

      - name: Client integration and stress tests
        shell: pwsh
        run: dotnet run --no-build --project SimpleSSHDSever/SimpleSSHDSever.csproj -- --integration-tests

      - name: Dependency and CVE scan
        shell: pwsh
        run: ./eng/security-scan.ps1
